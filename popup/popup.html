<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerifEye Quick Control</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <!-- Header -->
        <header class="popup-header">
            <div class="brand">
                <img src="../assets/icon48.png" width="24" height="24" alt="VerifEye Logo" class="logo">
                <div class="brand-info">
                    <span class="brand-title">VerifEye</span>
                    <span class="brand-sub">AI Forensics</span>
                </div>
            </div>
            
            <label class="switch" title="Toggle VerifEye Detection">
                <input type="checkbox" id="toggleExtension" checked>
                <span class="slider"></span>
            </label>
        </header>

        <!-- Status Indicator -->
        <div id="statusBanner" class="status-banner banner-active">
            <span class="status-dot"></span>
            <span id="statusText">Hover Detection Active</span>
        </div>

        <!-- Engine Mode Switcher -->
        <div class="section-block">
            <div class="section-label">Detection Engine</div>
            <div class="engine-tabs">
                <button class="engine-tab active" data-mode="local" title="100% Offline Forensic Algorithms">Local</button>
                <button class="engine-tab" data-mode="hybrid" title="Local Algorithms + Gemini Verification">Hybrid</button>
                <button class="engine-tab" data-mode="cloud" title="Gemini Cloud Multimodal Vision Only">Cloud</button>
            </div>
        </div>

        <!-- Live Scanning Stats -->
        <div class="section-block">
            <div class="section-label">Session Telemetry</div>
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-num" id="statTotal">0</span>
                    <span class="stat-label">Scanned</span>
                </div>
                <div class="stat-card stat-ai">
                    <span class="stat-num" id="statAi">0</span>
                    <span class="stat-label">AI Flagged</span>
                </div>
                <div class="stat-card stat-real">
                    <span class="stat-num" id="statReal">0</span>
                    <span class="stat-label">Authentic</span>
                </div>
            </div>
        </div>

        <!-- Quick Tester -->
        <div class="section-block">
            <div class="section-label">Quick Test</div>
            <div class="quick-drop" id="quickDrop">
                <span class="drop-text">Click or Drop Image Here</span>
                <input type="file" id="quickFileInput" accept="image/*" style="display: none;">
            </div>
            
            <div id="quickResult" class="quick-result" style="display: none;">
                <div class="result-header">
                    <span id="quickVerdict" class="verdict-tag">Analyzing...</span>
                    <span id="quickProb" class="prob-num">--%</span>
                </div>
                <div class="result-bar-bg">
                    <div id="quickBar" class="result-bar-fill"></div>
                </div>
                <div id="quickReason" class="quick-reason"></div>
            </div>
        </div>

        <!-- Footer Actions -->
        <footer class="popup-footer">
            <button id="openSettingsBtn" class="btn-footer">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                Forensics Lab &amp; Settings
            </button>
        </footer>
    </div>

    <script src="popup.js" type="module"></script>
</body>
</html>
