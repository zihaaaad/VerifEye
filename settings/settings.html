<!DOCTYPE html>
<html>
<head>
    <title>VerifEye Settings</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
            color: #2D3748; /* Dark Blue from logo */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: white;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 500px;
        }
        h1 {
            font-size: 24px;
            margin-top: 0;
            font-weight: 700;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 25px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            padding: 12px 24px;
            background-color: #2D3748; /* Dark Blue */
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #1A202C;
        }
        #status {
            margin-top: 20px;
            font-weight: 500;
        }
        p {
            font-size: 14px;
            color: #718096;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>VerifEye Settings</h1>
        <p>To get started, please enter your Gemini API key. You can get a free key from the Google AI Studio.</p>
        <label for="apiKey">Your Gemini API Key:</label>
        <input type="password" id="apiKey" placeholder="Enter your API key here">
        <button id="saveBtn">Save Key</button>
        <div id="status"></div>
    </div>
    <script src="settings.js"></script>
</body>
</html>
